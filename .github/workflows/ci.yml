name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension and CoApp
        run: npm run build

      - name: Test CoApp
        run: npm run test:coapp

      - name: Package extension smoke check
        run: npm run package:extension
